<!DOCTYPE html>
<!--
  BI aggregation state pie for Checkmk dashboards.

  Shipped by the bi_pie MKP and served at /<site>/check_mk/local/bi_pie/index.html.
  Embed it with the custom URL dashboard element, using the site-relative URL
  local/bi_pie/index.html (plus the query parameters below).

  Query parameters (all optional):
    group=<aggregation group>   repeatable, filters by BI aggregation group
    name=<aggregation title>    repeatable, filters by aggregation title
    title=<text>                heading above the chart
    refresh=<seconds>           reload interval, default 60, 0 disables
    theme=dark|light            default: the Checkmk theme of the embedding
                                page, dark when opened on its own
    list=0                      hide the list of non-OK aggregations
    debug=1                     dump the raw REST response
    view=tree                   layered view: one ring per level of the BI tree
    depth=<rings>               tree view: number of rule rings, default 3
    max=<count>                 tree view: most aggregations to load, default 40
    labels=0                    tree view: no names on the ring segments

  The tree view draws the rules of each aggregation's tree as rings, the
  innermost one per aggregation, and every host and service below them as a
  pill in a thin outer band, however deep it sits. Segments wide enough carry
  their name. OK is drawn paler than the problem states, which stand out.

  Hovering a slice, a ring segment, a pill or a legend row shows its details;
  hovering a legend row also fades everything of another state.

  The aggregation states come from the REST API. The tree view additionally
  loads each aggregation's full tree from ajax_fetch_aggregation_data.py, the
  GUI endpoint behind Checkmk's own BI visualization, because the REST API only
  reports the nodes that have a problem. Both are called with the viewer's own
  GUI session, so every user sees only what they are permitted to see.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>BI aggregation states</title>
<style>
  :root { --fg: #e8e8e8; --muted: #9aa3ad; --ring: #2c3844; --gap: #1e262e; --tip-bg: #161c22; }
  body.light { --fg: #1e262e; --muted: #5b6770; --ring: #dfe3e8; --gap: #ffffff; --tip-bg: #ffffff; }
  html, body { margin: 0; height: 100%; background: transparent; }
  body { color: var(--fg); font: 13px/1.4 "Lato", "Helvetica Neue", Arial, sans-serif;
         display: flex; flex-direction: column; padding: 8px; box-sizing: border-box; }
  h1 { font-size: 14px; font-weight: 600; margin: 0 0 6px; }
  #wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; flex: 0 0 auto; }
  svg { width: min(45vw, 60vh, 220px); height: auto; flex: 0 0 auto; }
  circle.slice { fill: none; stroke-width: 6; cursor: pointer; transition: stroke-width .15s; }
  /* OK paler than the problem states, so that those stand out. */
  circle.slice[data-state="0"], path.leaf[data-state="0"] { stroke-opacity: .55; }
  path.seg[data-state="0"] { fill-opacity: .55; }
  circle.slice:hover, circle.slice.active { stroke-width: 8; }
  circle.ring { fill: none; stroke: var(--ring); stroke-width: 6; }
  text.total { font-size: 8px; font-weight: 700; fill: var(--fg); text-anchor: middle; }
  text.sub { font-size: 3px; fill: var(--muted); text-anchor: middle; }
  /* Tree view: rings reach further in, so the centre label shrinks. */
  body.tree svg { width: min(60vw, 80vh, 420px); }
  body.tree circle.ring { display: none; }
  body.tree text.total { font-size: 5px; }
  body.tree text.sub { font-size: 2px; }
  path.seg { stroke: var(--gap); stroke-width: .35; cursor: pointer; }
  path.seg:hover, path.seg.active { opacity: .75; }
  path.leaf { fill: none; stroke-linecap: round; cursor: pointer; }
  path.leaf:hover { opacity: .75; }
  /* Names along the radius; the pointer goes through to the segment. */
  text.label { fill: #000; fill-opacity: .8; font-weight: 700; text-anchor: middle;
               dominant-baseline: central; pointer-events: none; }
  #detail { margin-top: 6px; min-height: 1.4em; }
  #detail .flag { color: var(--muted); font-size: 11px; }
  #legend { border-collapse: collapse; }
  #legend th { font-weight: 400; font-size: 11px; color: var(--muted); text-align: right;
               padding: 0 0 2px 14px; }
  #legend td { padding: 1px 0; }
  #legend tbody tr { cursor: pointer; }
  #legend tr.active { font-weight: 700; }
  #legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block;
              margin-right: 6px; }
  #legend td.n { text-align: right; padding-left: 14px; font-variant-numeric: tabular-nums; }
  #legend td.pct { color: var(--muted); }
  #legend td.bar { padding-left: 8px; }
  #legend .track { display: inline-block; width: 48px; height: 5px; border-radius: 3px;
                   background: var(--ring); overflow: hidden; vertical-align: middle; }
  #legend .fill { display: block; height: 100%; }
  /* While a legend row is hovered, everything of another state fades. */
  #slices.dim > :not(.hl) { opacity: .2; }
  #tip { position: fixed; z-index: 10; pointer-events: none; max-width: min(320px, 90vw);
         background: var(--tip-bg); color: var(--fg); border: 1px solid var(--ring);
         border-radius: 4px; padding: 6px 8px; font-size: 12px;
         box-shadow: 0 2px 8px rgba(0, 0, 0, .35); }
  #tip .head { font-weight: 700; }
  #tip .path, #tip .more { color: var(--muted); }
  #tip ul { list-style: none; margin: 4px 0 0; padding: 0; }
  #tip i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; margin-right: 5px; }
  #list { list-style: none; margin: 8px 0 0; padding: 0; overflow: auto; flex: 1 1 auto; }
  #list li { display: flex; gap: 6px; align-items: baseline; padding: 1px 0; }
  #list .badge { font-size: 10px; font-weight: 700; color: #000; border-radius: 2px;
                 padding: 0 4px; flex: 0 0 auto; }
  #list a { color: inherit; text-decoration: none; }
  #list a:hover { text-decoration: underline; }
  #list .flag { color: var(--muted); font-size: 11px; }
  #msg { color: var(--muted); margin-top: 6px; white-space: pre-wrap; }
  #msg.err { color: #ff6464; }
  pre { font-size: 11px; overflow: auto; }
</style>
</head>
<body>
<h1 id="title" hidden></h1>
<div id="wrap">
  <svg id="chart" viewBox="0 0 42 42" role="img" aria-label="BI aggregation states">
    <circle class="ring" id="ring" cx="21" cy="21" r="15.9155"/>
    <g id="slices" transform="rotate(-90 21 21)"></g>
    <g id="labels" transform="rotate(-90 21 21)"></g>
    <text class="total" x="21" y="22.5" id="total"></text>
    <text class="sub" x="21" y="27" id="sub">aggregations</text>
  </svg>
  <table id="legend"></table>
</div>
<div id="detail"></div>
<ul id="list"></ul>
<div id="msg"></div>
<pre id="debug" hidden></pre>
<div id="tip" hidden></div>

<script>
"use strict";

// Checkmk monitoring states; -1 is PENDING. Order is the draw order.
const STATES = [
  { id: 0,  label: "OK",      color: "#13d389" },
  { id: 1,  label: "WARN",    color: "#ffd703" },
  { id: 2,  label: "CRIT",    color: "#ff3232" },
  { id: 3,  label: "UNKNOWN", color: "#ff8800" },
  { id: -1, label: "PENDING", color: "#8a949e" },
];
const SVG_NS = "http://www.w3.org/2000/svg";

const params = new URLSearchParams(location.search);
const $ = (id) => document.getElementById(id);

// The page lives at /<site>/check_mk/local/bi_pie/, the GUI at /<site>/check_mk/.
const GUI_BASE = new URL("../../", location.href);
const API_URL = new URL(
  "api/1.0/domain-types/bi_aggregation/actions/aggregation_state/invoke", GUI_BASE);
for (const g of params.getAll("group")) API_URL.searchParams.append("filter_groups", g);
for (const n of params.getAll("name")) API_URL.searchParams.append("filter_names", n);

const showList = params.get("list") !== "0";
const showLabels = params.get("labels") !== "0";
const treeView = params.get("view") === "tree";
const depth = positiveInt("depth", 3);      // rings drawn in the tree view
const maxTrees = positiveInt("max", 40);    // one request per aggregation and refresh
let selected = null;   // state id the list is narrowed to, or null for all non-OK
let lastAggrs = [];
let lastTrees = null;  // Map of aggregation title -> tree, or null for the flat pie
let labelSpots = [];   // ring segments that may carry their name: {name, r0, r1, a0, a1}

function positiveInt(name, fallback) {
  if (!params.has(name)) return fallback;
  const value = Number(params.get(name));
  if (!Number.isInteger(value) || value < 1) {
    // Show the mistake in the widget; the throw then stops the script.
    message("Parameter " + name + " must be a positive integer.", true);
    throw new Error("invalid parameter " + name);
  }
  return value;
}

if (theme() === "light") document.body.classList.add("light");
if (treeView) document.body.classList.add("tree");
if (params.get("title")) {
  $("title").textContent = params.get("title");
  $("title").hidden = false;
}

// Explicit theme parameter, else the theme of the embedding Checkmk page, which
// marks its <body> with data-theme (for example "modern-dark" or "facelift").
function theme() {
  const explicit = params.get("theme");
  if (explicit === "dark" || explicit === "light") return explicit;
  if (explicit !== null) {
    message("Parameter theme must be dark or light.", true);
    throw new Error("invalid parameter theme");
  }
  // Same origin when embedded in Checkmk; any other parent is not readable.
  let parentTheme;
  try {
    parentTheme = window.parent.document.body.dataset.theme;
  } catch (err) {
    parentTheme = undefined;
  }
  return parentTheme && !parentTheme.includes("dark") ? "light" : "dark";
}

// Shows an error and removes the chart, so that outdated data cannot be
// mistaken for the current state.
function fail(text) {
  lastAggrs = [];
  lastTrees = null;
  labelSpots = [];
  for (const id of ["slices", "labels", "legend", "list", "detail"]) $(id).replaceChildren();
  $("total").textContent = "?";
  $("tip").hidden = true;
  message(text, true);
}

function message(text, isError) {
  $("msg").textContent = text || "";
  $("msg").classList.toggle("err", Boolean(isError));
}

function el(tag, props, ...children) {
  const node = document.createElement(tag);
  Object.assign(node, props);
  node.append(...children);
  return node;
}

async function load() {
  let data;
  try {
    const resp = await fetch(API_URL, {
      credentials: "same-origin",
      headers: { Accept: "application/json" },
    });
    if (resp.status === 401 || resp.status === 403) {
      throw new Error("Not authorised (HTTP " + resp.status + "). Log in to Checkmk first.");
    }
    if (!resp.ok) {
      throw new Error("REST API returned HTTP " + resp.status + ":\n" + (await resp.text()).slice(0, 400));
    }
    data = await resp.json();
  } catch (err) {
    fail(String(err.message || err));
    return;
  }

  if (params.get("debug") === "1") {
    $("debug").hidden = false;
    $("debug").textContent = JSON.stringify(data, null, 2);
  }

  // Expected: {aggregations: {<title>: {state, acknowledged, in_downtime, ...}},
  //            missing_sites: [...], missing_aggr: [...]}
  const body = data.aggregations ? data : (data.extensions || {});
  const aggrs = Object.entries(body.aggregations || {}).map(([title, a]) => ({
    title,
    state: STATES.some((s) => s.id === a.state) ? a.state : 3,
    acknowledged: Boolean(a.acknowledged),
    inDowntime: Boolean(a.in_downtime),
  }));
  const notes = [];
  let trees = null;
  if (treeView && aggrs.length > maxTrees) {
    // Refuse instead of loading a partial tree set that would look complete.
    notes.push("Tree view is limited to " + maxTrees + " aggregations, " + aggrs.length +
      " matched. Showing the flat pie; narrow with group= / name= or raise max=.");
  } else if (treeView) {
    try {
      trees = await loadTrees(aggrs.map((a) => a.title));
    } catch (err) {
      fail("Loading the aggregation trees failed: " + String(err.message || err));
      return;
    }
  }
  document.body.classList.toggle("tree", trees !== null);
  lastAggrs = aggrs;
  lastTrees = trees;
  render(aggrs);

  if (!aggrs.length) notes.push("No aggregations matched.");
  if ((body.missing_sites || []).length) notes.push("Missing sites: " + body.missing_sites.join(", "));
  if ((body.missing_aggr || []).length) notes.push("Missing aggregations: " + body.missing_aggr.join(", "));
  message(notes.join("\n"), false);
}

// Loads the full tree of every aggregation, a few requests at a time.
async function loadTrees(titles) {
  const trees = new Map();
  const queue = titles.slice();
  async function worker() {
    for (let title = queue.shift(); title !== undefined; title = queue.shift()) {
      trees.set(title, await loadTree(title));
    }
  }
  await Promise.all(Array.from({ length: Math.min(6, queue.length) }, worker));
  return trees;
}

async function loadTree(title) {
  const url = new URL("ajax_fetch_aggregation_data.py", GUI_BASE);
  url.searchParams.set("aggregations", JSON.stringify([title]));
  const resp = await fetch(url, { credentials: "same-origin", headers: { Accept: "application/json" } });
  if (!resp.ok) throw new Error("HTTP " + resp.status + " for \"" + title + "\"");
  const answer = await resp.json();
  // Ajax pages answer {result_code, result}; a non-zero code carries the error text.
  if (answer.result_code !== 0) throw new Error(String(answer.result));
  const root = answer.result && answer.result.node_config && answer.result.node_config.hierarchy;
  if (!root) throw new Error("No tree returned for \"" + title + "\"");
  return toNode(root);
}

// Reduces a node of Checkmk's BI visualization data to what the chart needs.
function toNode(raw) {
  const core = (raw.type_specific && raw.type_specific.core) || {};
  const children = (raw.children || []).map(toNode);
  return {
    name: String(raw.name),
    state: STATES.some((s) => s.id === core.state) ? core.state : 3,
    acknowledged: Boolean(core.acknowledged),
    inDowntime: Boolean(core.in_downtime),
    // Rules are inner nodes; leaves are hosts or services.
    rule: raw.rule_id ? raw.rule_id.pack + " / " + raw.rule_id.rule : null,
    host: core.hostname || null,
    service: core.service || null,
    children,
    // Angular weight: every host or service counts once.
    leaves: children.length ? children.reduce((sum, c) => sum + c.leaves, 0) : 1,
  };
}

// Number of hosts and services per state below a node (the node itself if it is one).
function leafStates(node, counts = new Map()) {
  if (!node.children.length) counts.set(node.state, (counts.get(node.state) || 0) + 1);
  for (const child of node.children) leafStates(child, counts);
  return counts;
}

function flagsOf(item) {
  return [item.acknowledged && "acknowledged", item.inDowntime && "in downtime"].filter(Boolean);
}

// "12 OK, 1 WARN", in the fixed state order.
function stateSummary(counts) {
  return STATES.filter((s) => counts.get(s.id)).map((s) => counts.get(s.id) + " " + s.label).join(", ");
}

// --- hover details ----------------------------------------------------------

// Shows the nodes build() returns next to the pointer while it is over element.
function hoverTip(element, build) {
  element.addEventListener("mouseenter", () => {
    $("tip").replaceChildren(...build());
    $("tip").hidden = false;
  });
  element.addEventListener("mousemove", (event) => {
    // Keep the box inside the widget: flip to the other side of the pointer
    // where it would otherwise be cut off.
    const tip = $("tip"), gap = 12;
    const x = event.clientX + gap + tip.offsetWidth > innerWidth
      ? event.clientX - gap - tip.offsetWidth : event.clientX + gap;
    const y = event.clientY + gap + tip.offsetHeight > innerHeight
      ? event.clientY - gap - tip.offsetHeight : event.clientY + gap;
    tip.style.left = Math.max(0, x) + "px";
    tip.style.top = Math.max(0, y) + "px";
  });
  element.addEventListener("mouseleave", () => { $("tip").hidden = true; });
}

function swatch(color) {
  const mark = el("i", {});
  mark.style.background = color;
  return mark;
}

// Details of one state: share of the aggregations and their names.
function stateTip(state, aggrs) {
  const mine = aggrs.filter((a) => a.state === state.id).sort((a, b) => a.title.localeCompare(b.title));
  const share = aggrs.length ? (mine.length / aggrs.length * 100).toFixed(1) : "0.0";
  const shown = mine.slice(0, 8);
  const nodes = [
    el("div", { className: "head" }, swatch(state.color),
      state.label + ": " + mine.length + " of " + aggrs.length + " aggregations (" + share + " %)"),
    el("ul", {}, ...shown.map((a) => el("li", {}, a.title + " ",
      el("span", { className: "more", textContent: flagsOf(a).join(", ") })))),
  ];
  if (mine.length > shown.length) {
    nodes.push(el("div", { className: "more", textContent: "and " + (mine.length - shown.length) + " more" }));
  }
  if (lastTrees) {
    const leaves = new Map();
    for (const a of mine) leafStates(lastTrees.get(a.title), leaves);
    nodes.push(el("div", { className: "more", textContent: "Hosts and services below: " + stateSummary(leaves) }));
  }
  return nodes;
}

// Details of one tree segment: where it sits, what it is and what is below it.
function nodeTip(node, path) {
  const state = STATES.find((s) => s.id === node.state);
  const kind = node.rule ? "Rule " + node.rule
    : node.service ? "Service on host " + node.host : "Host";
  const nodes = [];
  if (path.length > 1) {
    nodes.push(el("div", { className: "path", textContent: path.slice(0, -1).join(" \u203a ") }));
  }
  nodes.push(el("div", { className: "head" }, swatch(state.color), node.name));
  nodes.push(el("div", { textContent: [state.label].concat(flagsOf(node)).join(", ") }));
  nodes.push(el("div", { className: "more", textContent: kind }));
  if (node.children.length) {
    nodes.push(el("div", { className: "more",
      textContent: node.leaves + " hosts and services below: " + stateSummary(leafStates(node)) }));
  }
  return nodes;
}

// Fades every slice and segment that is not of the given state (null: none).
function highlight(stateId) {
  $("slices").classList.toggle("dim", stateId !== null);
  for (const mark of $("slices").children) {
    mark.classList.toggle("hl", Number(mark.dataset.state) === stateId);
  }
}

// Point at radius r and angle a (radians, clockwise from the group's zero
// direction, which the rotated <g> points to twelve o'clock), as "x,y".
function at(r, a) {
  return (21 + r * Math.cos(a)).toFixed(3) + "," + (21 + r * Math.sin(a)).toFixed(3);
}

// Ring segment between two radii and two angles.
function segmentPath(r0, r1, a0, a1) {
  if (a1 - a0 >= 2 * Math.PI - 1e-9) {
    // An arc cannot span a full circle, so draw two circles and cut the inner out.
    const circle = (r) => "M" + (21 - r) + ",21a" + r + "," + r + " 0 1,0 " + 2 * r + ",0a" +
      r + "," + r + " 0 1,0 " + -2 * r + ",0Z";
    return circle(r1) + circle(r0);
  }
  const large = a1 - a0 > Math.PI ? 1 : 0;
  return "M" + at(r1, a0) + "A" + r1 + "," + r1 + " 0 " + large + ",1 " + at(r1, a1) +
    "L" + at(r0, a1) + "A" + r0 + "," + r0 + " 0 " + large + ",0 " + at(r0, a0) + "Z";
}

// The tree view's radii: the rule rings, then the band of hosts and services.
const INNER = 7.5, RULES_OUTER = 18.3, BAND = 19.7, BAND_WIDTH = 1.3;

// Layered view: ring 1 holds one equal segment per aggregation, each further
// ring the next level of rules, with children sharing their parent's angle by
// the number of hosts and services below them. The hosts and services
// themselves are pills in the outer band, below rules of any depth.
function renderTree(aggrs, trees) {
  const width = (RULES_OUTER - INNER) / depth;
  const slices = $("slices");
  slices.replaceChildren();
  labelSpots = [];

  function mark(tag, node, here) {
    const state = STATES.find((s) => s.id === node.state);
    const shape = document.createElementNS(SVG_NS, tag);
    shape.dataset.state = node.state;
    shape.setAttribute("aria-label", here.join(" \u203a ") + ": " + state.label);
    hoverTip(shape, () => nodeTip(node, here));
    slices.append(shape);
    return [shape, state];
  }

  function draw(node, a0, a1, level, path) {
    const here = path.concat(node.name);
    if (!node.children.length) {
      pill(node, a0, a1, here);
      return;
    }
    if (level < depth) {
      const r0 = INNER + level * width, r1 = r0 + width;
      const [seg, state] = mark("path", node, here);
      seg.setAttribute("class", "seg");
      seg.setAttribute("fill", state.color);
      seg.setAttribute("fill-rule", "evenodd");
      seg.setAttribute("d", segmentPath(r0, r1, a0, a1));
      seg.addEventListener("click", () => showDetail(seg, node, here));
      labelSpots.push({ name: node.name, r0, r1, a0, a1 });
    }
    let start = a0;
    for (const child of node.children) {
      const end = start + (a1 - a0) * child.leaves / node.leaves;
      draw(child, start, end, level + 1, here);
      start = end;
    }
  }

  // A host or service: an arc with round ends in the band, a dot where its
  // angle is too small for more, with a gap to its neighbours.
  function pill(node, a0, a1, here) {
    // A problem stays visible among hundreds of OK pills: bigger than its
    // share where needed, and drawn after them (above).
    const room = (a1 - a0) * BAND;
    const least = node.state === 0 ? 0.25 : 0.8;
    const thick = Math.max(least, Math.min(BAND_WIDTH, room - 0.25));
    const cap = (thick / 2 + 0.15) / BAND;
    let s = a0 + cap, e = a1 - cap;
    if (e <= s) s = e = (a0 + a1) / 2;
    const [leaf, state] = mark("path", node, here);
    leaf.setAttribute("class", "leaf");
    leaf.setAttribute("stroke", state.color);
    leaf.setAttribute("stroke-width", thick);
    // A zero-length arc draws nothing, its round caps a dot.
    leaf.setAttribute("d", "M" + at(BAND, s) + "A" + BAND + "," + BAND + " 0 " +
      (e - s > Math.PI ? 1 : 0) + ",1 " + at(BAND, Math.max(e, s + 1e-4)));
    leaf.addEventListener("click", () => showDetail(leaf, node, here));
    if (node.state !== 0) problems.push(leaf);
  }

  // Same order as the flat pie, so the inner ring reads like it.
  const ordered = aggrs.slice().sort((a, b) =>
    STATES.findIndex((s) => s.id === a.state) - STATES.findIndex((s) => s.id === b.state) ||
    a.title.localeCompare(b.title));
  const step = 2 * Math.PI / ordered.length;
  const problems = [];
  ordered.forEach((a, i) => draw(trees.get(a.title), i * step, (i + 1) * step, 0, []));
  slices.append(...problems);
  renderLabels();
}

// Names on the ring segments where they can be read: at least 8 px high in the
// chart's current size, and whole or at least five characters before an
// ellipsis. Straight along the radius in a narrow segment, curved along the
// ring in a wide one, whichever shows more of the name. Again on every resize.
function renderLabels() {
  const group = $("labels");
  group.replaceChildren();
  const unit = $("chart").getBoundingClientRect().width / 42;  // px per viewBox unit
  if (!showLabels || !unit) return;
  labelSpots.forEach((spot, index) => {
    const full = spot.a1 - spot.a0 >= 2 * Math.PI - 1e-9;
    const middle = (spot.r0 + spot.r1) / 2, deep = spot.r1 - spot.r0;
    // A full ring's name runs over its top half.
    const a0 = full ? -Math.PI / 2 : spot.a0, a1 = full ? Math.PI / 2 : spot.a1;
    const arc = (a1 - a0) * middle;
    const radial = { size: Math.min(10 / unit, arc * 0.7), length: deep - 0.6, curved: false };
    const curved = { size: Math.min(10 / unit, deep * 0.6), length: arc * 0.9, curved: true };
    const fit = (way) => way.size * unit < 8 ? 0 : Math.floor(way.length / (way.size * 0.6));
    const way = fit(curved) > fit(radial) ? curved : radial;
    const chars = fit(way);
    if (chars < Math.min(spot.name.length, 5)) return;
    const name = spot.name.length > chars ? spot.name.slice(0, chars - 1) + "\u2026" : spot.name;
    const angle = (a0 + a1) / 2;
    // The group is turned by -90 degrees: a direction of r degrees in it points
    // at r - 90 on screen, where y grows downwards.
    const onScreen = ((angle * 180 / Math.PI - 90) % 360 + 360) % 360;
    const text = document.createElementNS(SVG_NS, "text");
    text.setAttribute("class", "label");
    text.setAttribute("font-size", way.size.toFixed(3));
    if (way.curved) {
      // Clockwise over the top half, counter-clockwise below, so that it reads
      // from left to right either way.
      const below = onScreen > 0.5 && onScreen < 179.5;
      const arcPath = document.createElementNS(SVG_NS, "path");
      arcPath.id = "label-arc-" + index;
      arcPath.setAttribute("fill", "none");
      arcPath.setAttribute("d", below
        ? "M" + at(middle, a1) + "A" + middle + "," + middle + " 0 0,0 " + at(middle, a0)
        : "M" + at(middle, a0) + "A" + middle + "," + middle + " 0 0,1 " + at(middle, a1));
      const along = document.createElementNS(SVG_NS, "textPath");
      along.setAttribute("href", "#" + arcPath.id);
      along.setAttribute("startOffset", "50%");
      along.textContent = name;
      text.append(along);
      group.append(arcPath, text);
      return;
    }
    // Along the radius, turned over where it would read upside down.
    let rotation = angle * 180 / Math.PI;
    if (onScreen > 90.5 && onScreen < 269.5) rotation += 180;
    const [x, y] = at(middle, angle).split(",");
    text.setAttribute("x", x);
    text.setAttribute("y", y);
    text.setAttribute("transform", "rotate(" + rotation.toFixed(2) + " " + x + " " + y + ")");
    text.textContent = name;
    group.append(text);
  });
}

function showDetail(seg, node, path) {
  for (const other of document.querySelectorAll("#slices .active")) other.classList.remove("active");
  seg.classList.add("active");
  const state = STATES.find((s) => s.id === node.state);
  const flags = [node.acknowledged && "ack", node.inDowntime && "downtime",
                 node.rule && "rule " + node.rule].filter(Boolean).join(", ");
  $("detail").replaceChildren(
    el("span", { textContent: path.join(" \u203a ") + ": " + state.label + " " }),
    el("span", { className: "flag", textContent: flags }));
}

function render(aggrs) {
  const total = aggrs.length;
  const counts = new Map(STATES.map((s) => [s.id, 0]));
  for (const a of aggrs) counts.set(a.state, counts.get(a.state) + 1);

  // Donut built from stroked circles: r is chosen so the circumference is 100,
  // which makes dash lengths equal to percentages and handles a 100% slice.
  const slices = $("slices");
  slices.replaceChildren();
  slices.classList.remove("dim");
  $("detail").replaceChildren();
  // A refresh replaces the element under the pointer, which would orphan the box.
  $("tip").hidden = true;
  $("labels").replaceChildren();
  labelSpots = [];
  // A small gap between slices, none for a single one.
  const present = STATES.filter((s) => counts.get(s.id)).length;
  const gap = present > 1 ? 0.8 : 0;
  $("ring").style.display = total && !lastTrees ? "none" : "";
  let offset = 0;
  for (const s of STATES) {
    const n = counts.get(s.id);
    if (!n || lastTrees) continue;
    const pct = (n / total) * 100;
    const c = document.createElementNS(SVG_NS, "circle");
    c.setAttribute("class", "slice" + (selected === s.id ? " active" : ""));
    c.setAttribute("cx", 21);
    c.setAttribute("cy", 21);
    c.setAttribute("r", 15.9155);
    c.setAttribute("stroke", s.color);
    c.setAttribute("stroke-dasharray", Math.max(pct - gap, 0.1) + " " + (100 - pct + gap));
    c.setAttribute("stroke-dashoffset", -(offset + gap / 2));
    c.dataset.state = s.id;
    c.setAttribute("aria-label", s.label + ": " + n + " (" + pct.toFixed(1) + " %)");
    hoverTip(c, () => stateTip(s, aggrs));
    c.addEventListener("click", () => select(s.id));
    slices.append(c);
    offset += pct;
  }
  if (lastTrees && total) renderTree(aggrs, lastTrees);
  $("total").textContent = total;
  $("sub").textContent = total === 1 ? "aggregation" : "aggregations";
  // The tree view's rings reach further in, so the label sits tighter.
  $("total").setAttribute("y", lastTrees ? 21.4 : 22.5);
  $("sub").setAttribute("y", lastTrees ? 24.2 : 27);

  // Legend: aggregations per state with their share and, in the tree view,
  // the hosts and services per state across all loaded trees.
  const leaves = new Map();
  if (lastTrees) for (const tree of lastTrees.values()) leafStates(tree, leaves);
  const head = el("tr", {}, el("th", {}), el("th", { textContent: "aggr." }), el("th", { textContent: "share" }),
    el("th", {}));
  if (lastTrees) head.append(el("th", { textContent: "hosts/svc" }));
  const rows = STATES.filter((s) => counts.get(s.id) || leaves.get(s.id) || s.id >= 0 && s.id <= 2).map((s) => {
    const share = total ? (counts.get(s.id) / total * 100).toFixed(0) + " %" : "";
    const row = el("tr", { className: selected === s.id ? "active" : "" },
      el("td", {}, swatch(s.color), s.label),
      el("td", { className: "n", textContent: counts.get(s.id) }),
      el("td", { className: "n pct", textContent: share }),
      el("td", { className: "bar" }, bar(s, total ? counts.get(s.id) / total : 0)));
    if (lastTrees) row.append(el("td", { className: "n", textContent: leaves.get(s.id) || 0 }));
    row.addEventListener("click", () => select(s.id));
    row.addEventListener("mouseenter", () => highlight(s.id));
    row.addEventListener("mouseleave", () => highlight(null));
    hoverTip(row, () => stateTip(s, aggrs));
    return row;
  });
  $("legend").replaceChildren(el("thead", {}, head), el("tbody", {}, ...rows));

  renderList(aggrs);
}

// The share as a bar in the state's color.
function bar(state, share) {
  const fill = el("span", { className: "fill" });
  fill.style.width = (share * 100).toFixed(1) + "%";
  fill.style.background = state.color;
  return el("span", { className: "track" }, fill);
}

function renderList(aggrs) {
  if (!showList) return;
  const rows = aggrs
    .filter((a) => (selected === null ? a.state !== 0 : a.state === selected))
    .sort((a, b) => severity(b.state) - severity(a.state) || a.title.localeCompare(b.title));
  $("list").replaceChildren(...rows.map((a) => {
    const s = STATES.find((x) => x.id === a.state);
    const badge = el("span", { className: "badge", textContent: s.label });
    badge.style.background = s.color;
    const href = new URL("view.py", GUI_BASE);
    href.searchParams.set("view_name", "aggr_single");
    href.searchParams.set("aggr_name", a.title);
    // _parent: replace the dashboard in Checkmk's main frame, not this iframe.
    const link = el("a", { href: href.toString(), target: "_parent", textContent: a.title });
    const flags = [a.acknowledged && "ack", a.inDowntime && "downtime"].filter(Boolean).join(", ");
    return el("li", {}, badge, link, el("span", { className: "flag", textContent: flags }));
  }));
}

// CRIT > UNKNOWN > WARN > PENDING > OK, matching Checkmk's worst-state ordering.
function severity(state) {
  return { 2: 4, 3: 3, 1: 2, "-1": 1, 0: 0 }[state];
}

function select(stateId) {
  selected = selected === stateId ? null : stateId;
  render(lastAggrs);
}

load();
// The labels' size follows the chart's.
new ResizeObserver(() => renderLabels()).observe($("chart"));
const refresh = params.has("refresh") ? Number(params.get("refresh")) : 60;
if (refresh > 0) setInterval(load, refresh * 1000);
</script>
</body>
</html>
