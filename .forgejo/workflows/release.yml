---
# A release from its tag (vX.Y.Z, which the release bot pushes; .cz.toml): the MKP,
# built from the tagged sources, as the release's file, with the changelog's section
# as its notes. The tag must be build.py's version, which names the MKP and its
# manifest.
name: Release
enable-email-notifications: true
"on":
  push:
    tags: ["v*"]
  # Run by hand to retry a tag's release from main, with the tag in the field.
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to release (vX.Y.Z)
        type: string
        required: true

jobs:
  release:
    # Python, Node.js (the actions) and the tools forgejo-release calls.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out the tag
        uses: https://github.com/actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0

      - name: Check the tag against the package's version
        run: |
          version=$(python3 -c 'import build; print(build.VERSION)')
          if [ "$TAG" != "v$version" ]; then
            echo "::error::$TAG is not the version in build.py ($version)"
            exit 1
          fi

      - name: Build the MKP
        run: |
          python3 build.py
          mkdir release && cp dist/*.mkp release/
          (cd release && sha256sum *.mkp > SHA256SUMS)

      # The changelog's section of the version; without one, the commits since the
      # previous tag.
      - name: Write the release notes
        id: notes
        run: |
          previous=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          notes=$(awk -v v="${TAG#v}" '/^## / { if (found) exit; h = $2; sub(/^v/, "", h)
            if (h == v) { found = 1; next } } found' CHANGELOG.md 2>/dev/null | sed '/./,$!d' || true)
          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            notes=$(git log --no-merges --format='- %s' ${previous:+"$previous.."}"$TAG")
          fi
          {
            echo 'notes<<END_OF_NOTES'
            printf '%s\n' "$notes"
            echo END_OF_NOTES
          } >> "$GITHUB_OUTPUT"

      - name: Publish the release
        uses: https://code.forgejo.org/actions/forgejo-release@v2
        with:
          direction: upload
          url: ${{ github.server_url }}
          repo: ${{ github.repository }}
          tag: ${{ env.TAG }}
          title: ${{ env.TAG }}
          release-dir: release
          override: false
          release-notes: ${{ steps.notes.outputs.notes }}
