---
# The checks of every change, and the release of every tag once they pass:
# - unit: the package's sources, the MKP and the page in a browser; the MKP is
#   kept as the run's artifact;
# - integration: a matrix of real Checkmk sites, one job per version and one for
#   the update from 2.4 to 2.5, installed from Checkmk's newest patch releases
#   (tests/integration/packages.py);
# - release: for a tag (vX.Y.Z, which the release bot pushes; .cz.toml), the MKP
#   as a release, only when every job above passed.
# Weekly too, so that a new patch release of Checkmk is tested with the package
# before anyone updates to it. A failed release is run again from the run's page
# (re-run failed jobs).
name: CI
# A failed job mails whoever started the run. Renovate's bot has no mailbox: when its
# branch fails, Renovate opens a pull request, which mails the repository's watchers.
# yaml-language-server-disable Property enable-email-notifications is not allowed.
enable-email-notifications: true
"on":
  push:
    # renovate/all-patch: patches merge without a pull request once CI passes.
    branches: [main, renovate/all-patch]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    # A whole Ubuntu with sudo, for the browser's libraries (playwright --with-deps).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: https://github.com/actions/checkout@v7

      - name: Install the test tools
        run: &install |
          python3 -m venv .venv
          .venv/bin/pip install --quiet --disable-pip-version-check -r requirements-test.txt
          .venv/bin/playwright install --with-deps chromium > /dev/null

      # Checkmk's current versions (stable_downloads.json) against the matrix below
      # and the manifest's range: the weekly run fails when Checkmk releases a new
      # version, until the package is tested with it.
      - name: Check the tested Checkmk versions
        run: .venv/bin/python tests/integration/packages.py --check 2.4 2.5

      - name: Unit tests
        id: tests
        run: .venv/bin/python -m pytest --junitxml=/tmp/pytest.xml

      # The results as one comment on the pull request (dawid/ci-actions), also when
      # tests failed.
      - name: Test report
        if: always() && steps.tests.outcome != 'skipped'
        uses: https://git.ciepiela.org/dawid/ci-actions/test-report@main
        with:
          junit: /tmp/pytest.xml

      - name: Build the MKP
        run: python3 build.py

      # Forgejo's fork: GitHub's v4 refuses a server that is not GitHub's.
      - name: Keep the MKP
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: mkp
          path: dist/*.mkp
          retention-days: 14

  integration:
    needs: unit
    name: integration (${{ matrix.name }})
    # Docker (rootless) and loopback: the sites run in containers on published ports
    # of 127.0.0.1, which the tests and the browser reach. The runner takes one job
    # at a time, so the matrix's jobs run one after the other.
    runs-on: ubuntu-latest
    # The image takes a few minutes to build, each site 2 to 3 to set up.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # The versions Checkmk maintains (the unit job checks the list), and the update
      # between them.
      matrix:
        include:
          - name: Checkmk 2.4
            versions: "2.4"
            tests: tests/integration/test_checkmk.py
          - name: Checkmk 2.5
            versions: "2.5"
            tests: tests/integration/test_checkmk.py
          - name: update 2.4 to 2.5
            versions: "2.4 2.5"
            tests: tests/integration/test_update.py
    env:
      # The versions the image holds (tests/integration/checkmk_site.py).
      BI_PIE_VERSIONS: ${{ matrix.versions }}
    steps:
      - name: Check out
        uses: https://github.com/actions/checkout@v7

      - name: Install the test tools
        run: *install

      # Apart from the tests, so that the log shows which patch releases are tested.
      - name: Download Checkmk
        run: .venv/bin/python tests/integration/packages.py $BI_PIE_VERSIONS

      - name: Integration tests
        id: tests
        run: .venv/bin/python -m pytest ${{ matrix.tests }} --junitxml=/tmp/pytest.xml

      # One comment per matrix entry: the report is named after it.
      - name: Test report
        if: always() && steps.tests.outcome != 'skipped'
        uses: https://git.ciepiela.org/dawid/ci-actions/test-report@main
        with:
          junit: /tmp/pytest.xml
          name: CI / integration (${{ matrix.name }})

  release:
    needs: [unit, integration]
    if: startsWith(github.ref, 'refs/tags/v')
    # Python, Node.js (the actions) and the tools forgejo-release calls.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Check out
        uses: https://github.com/actions/checkout@v7
        with:
          fetch-depth: 0

      # The tag names the version; build.py writes it into the MKP's name and manifest.
      - name: Check the tag against the package's version
        run: |
          version=$(python3 -c 'import build; print(build.VERSION)')
          if [ "$TAG" != "v$version" ]; then
            echo "::error::$TAG is not the version in build.py ($version)"
            exit 1
          fi

      - name: Build the MKP
        run: |
          python3 build.py
          mkdir release && cp dist/*.mkp release/
          (cd release && sha256sum *.mkp > SHA256SUMS)

      # The changelog's section of the version; without one, the commits since the
      # previous tag.
      - name: Write the release notes
        id: notes
        run: |
          previous=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          notes=$(awk -v v="${TAG#v}" '/^## / { if (found) exit; h = $2; sub(/^v/, "", h)
            if (h == v) { found = 1; next } } found' CHANGELOG.md 2>/dev/null | sed '/./,$!d' || true)
          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            notes=$(git log --no-merges --format='- %s' ${previous:+"$previous.."}"$TAG")
          fi
          {
            echo 'notes<<END_OF_NOTES'
            printf '%s\n' "$notes"
            echo END_OF_NOTES
          } >> "$GITHUB_OUTPUT"

      - name: Publish the release
        uses: https://code.forgejo.org/actions/forgejo-release@v2
        with:
          direction: upload
          url: ${{ github.server_url }}
          repo: ${{ github.repository }}
          tag: ${{ env.TAG }}
          title: ${{ env.TAG }}
          release-dir: release
          override: false
          release-notes: ${{ steps.notes.outputs.notes }}
